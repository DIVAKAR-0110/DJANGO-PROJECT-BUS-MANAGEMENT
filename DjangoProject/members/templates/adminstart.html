{% extends 'base.html' %}
{% load static %}

{% block title %}Admin Verification | CIT Bus{% endblock %}

{% block extra_css %}
<style>
    body {
        background: radial-gradient(circle at top right, rgba(0, 247, 255, 0.1), transparent),
                    radial-gradient(circle at bottom left, rgba(0, 124, 240, 0.1), transparent),
                    var(--dark);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    
    .login-container {
        max-width: 450px;
        width: 100%;
        margin: auto;
    }
    
    .form-control-premium {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 12px 16px;
        color: white;
        transition: all 0.3s ease;
    }
    
    .form-control-premium:focus {
        background: rgba(255, 255, 255, 0.07);
        border-color: #00f7ff;
        box-shadow: 0 0 0 4px rgba(0, 247, 255, 0.1);
        color: white;
        outline: none;
    }

    .admin-icon-container {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #00f7ff, #007cf0);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        margin: 0 auto 2rem;
        box-shadow: 0 10px 20px rgba(0, 247, 255, 0.3);
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container py-5 animate-fade-in">
    <div class="glass-card p-4 p-md-5">
        <div class="text-center">
            <div class="admin-icon-container">
                <i class="fas fa-user-shield text-white"></i>
            </div>
            <h2 class="fw-800 mb-2">Admin <span class="text-gradient" style="background: linear-gradient(135deg, #00f7ff 0%, #007cf0 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Verification</span></h2>
            <p class="text-gray mb-4">Central system oversight restricted access.</p>
        </div>

        <form id="adminLoginForm" class="mt-4">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="form-label text-gray small fw-bold text-uppercase">Admin Username</label>
                <div class="input-group">
                    <span class="input-group-text glass-card border-end-0 border-secondary border-opacity-25 text-gray" style="border-radius: 12px 0 0 12px;">
                        <i class="fas fa-terminal"></i>
                    </span>
                    <input type="text" id="username" class="form-control form-control-premium border-start-0" style="border-radius: 0 12px 12px 0;" placeholder="root_admin" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-gray small fw-bold text-uppercase">Secret Key</label>
                <div class="input-group">
                    <span class="input-group-text glass-card border-end-0 border-secondary border-opacity-25 text-gray" style="border-radius: 12px 0 0 12px;">
                        <i class="fas fa-key"></i>
                    </span>
                    <input type="password" id="password" class="form-control form-control-premium border-start-0" style="border-radius: 0 12px 12px 0;" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-premium w-100 justify-content-center py-3 mb-4" style="background: linear-gradient(135deg, #00f7ff, #007cf0);">
                Authenticate <i class="fas fa-shield-alt ms-2"></i>
            </button>

            <div class="text-center">
                <button type="button" onclick="history.back()" class="btn glass-card border-secondary border-opacity-25 text-light px-4 py-2 small">
                    <i class="fas fa-arrow-left me-2"></i> Exit
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById("adminLoginForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const username = document.querySelector("#username").value.trim();
        const password = document.querySelector("#password").value;

        // Note: Maintaining existing hardcoded validation from source
        const validUsername = "divakar";
        const validPassword = "R_diva_0110_";

        if (username === validUsername && password === validPassword) {
            // Success state UI
            this.querySelector('button').innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Access Granted...';
            setTimeout(() => {
                window.location.href = "{% url 'admindashboard' %}";
            }, 800);
        } else {
            // Error state UI
            const btn = this.querySelector('button');
            const originalText = btn.innerHTML;
            btn.classList.replace('btn-premium', 'btn-danger');
            btn.innerHTML = '<i class="fas fa-times-circle me-2"></i> Access Denied';
            
            setTimeout(() => {
                btn.classList.replace('btn-danger', 'btn-premium');
                btn.innerHTML = originalText;
            }, 2000);
        }
    });
</script>
{% endblock %}
