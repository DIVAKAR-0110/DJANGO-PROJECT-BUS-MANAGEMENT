{% extends 'base.html' %}
{% load static %}

{% block title %}Travelix | Processing{% endblock %}

{% block extra_css %}
<style>
    body {
        background-color: var(--dark);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .loader-container {
        text-align: center;
    }

    .pulse-logo {
        width: 120px;
        height: 120px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 40px;
        position: relative;
    }

    .pulse-logo::before,
    .pulse-logo::after {
        content: '';
        position: absolute;
        inset: -10px;
        border: 2px solid var(--primary);
        border-radius: 45px;
        animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
    }

    .pulse-logo::after {
        animation-delay: 0.5s;
    }

    @keyframes pulse-ring {
        0% { transform: scale(0.8); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: scale(1.3); opacity: 0; }
    }

    .loading-bar {
        width: 200px;
        height: 4px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        margin: 20px auto;
        position: relative;
        overflow: hidden;
    }

    .loading-bar-progress {
        position: absolute;
        left: -100%;
        width: 100%;
        height: 100%;
        background: var(--grad-primary);
        animation: loading-slide 2s infinite ease-in-out;
    }

    @keyframes loading-slide {
        0% { left: -100%; }
        100% { left: 100%; }
    }
</style>
{% endblock %}

{% block content %}
<div class="loader-container animate-fade-in">
    <div class="pulse-logo">
        <img src="{% static 'image/bus_logo.png' %}" width="60" alt="Logo">
    </div>
    <h2 class="text-white fw-800 ls-2">TRAVELIX</h2>
    <div class="loading-bar">
        <div class="loading-bar-progress"></div>
    </div>
    <p class="text-gray smaller text-uppercase ls-1">Securing your journey...</p>
</div>
{% endblock %}

{% block extra_js %}
<script>
    setTimeout(() => {
        window.location.href = "{% url 'mainpage' %}";
    }, 3000);
</script>
{% endblock %}
