{% extends 'base.html' %}
{% load static %}

{% block title %}Travelix | Loading{% endblock %}

{% block extra_css %}
<style>
    body {
        background-color: var(--dark);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .splash-wrapper {
        text-align: center;
    }

    .loader-glow {
        width: 150px;
        height: 150px;
        position: relative;
        margin: 0 auto 40px;
    }

    .loader-glow::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: var(--grad-primary);
        filter: blur(40px);
        opacity: 0.3;
        animation: pulse 2s infinite;
    }

    .loader-ring {
        position: absolute;
        inset: 0;
        border: 4px solid transparent;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    .loader-ring::after {
        content: '';
        position: absolute;
        inset: 15px;
        border: 4px solid transparent;
        border-bottom-color: var(--secondary);
        border-radius: 50%;
        animation: spin 2s linear infinite reverse;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.2; }
        50% { transform: scale(1.2); opacity: 0.4; }
    }

    .splash-logo {
        width: 120px;
        height: 120px;
        background: white;
        padding: 20px;
        border-radius: 30px;
        margin-bottom: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
</style>
{% endblock %}

{% block content %}
<div class="splash-wrapper animate-fade-in">
    <div class="loader-glow">
        <div class="loader-ring"></div>
        <img src="{% static 'image/bus_logo.png' %}" style="position: absolute; inset: 0; margin: auto; width: 60px; height: 60px; filter: drop-shadow(0 0 10px rgba(99,102,241,0.5));" alt="Logo">
    </div>
    
    <h1 class="display-3 fw-800 text-white mb-2" style="letter-spacing: 5px;">TRAVELIX</h1>
    <p class="text-gray lead">Discovering your next journey...</p>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const redirectUrl = "{% url 'clgintropage' %}";
    setTimeout(() => {
        window.location.href = redirectUrl;
    }, 3500);
</script>
{% endblock %}
