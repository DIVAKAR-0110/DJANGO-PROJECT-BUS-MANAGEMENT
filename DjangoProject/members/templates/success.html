{% extends 'base.html' %}
{% load static %}

{% block title %}Action Successful | CIT Bus{% endblock %}

{% block extra_css %}
<style>
    body {
        background-color: var(--dark);
    }
    
    .success-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 60px 40px;
        text-align: center;
    }

    .success-icon-wrapper {
        width: 120px;
        height: 120px;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid var(--glass-border);
        border-radius: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
        color: #10b981;
        margin: 0 auto 40px;
        animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes scaleIn {
        from { transform: scale(0); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-5 animate-fade-in">
    <div class="glass-card success-container shadow-2xl">
        <div class="success-icon-wrapper">
            <i class="fas fa-check-circle"></i>
        </div>
        
        <h1 class="fw-800 text-white mb-3">Action Completed!</h1>
        <p class="text-gray lead mb-5">Your request has been processed successfully. Thank you for using our platform.</p>

        <div class="d-grid gap-3">
            <a href="{% url 'mainpage' %}" class="btn-premium py-3 justify-content-center">
                Return to Homepage
            </a>
            <button onclick="history.back()" class="btn glass-card py-3 text-gray">
                <i class="fas fa-arrow-left me-2"></i> Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
